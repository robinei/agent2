[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.23.2", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jiff = { version = "0.2.28", features = ["serde"] }
interp = { path = "../interp" }

[dev-dependencies]
tempfile = "3"
