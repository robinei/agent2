[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[dependencies]
uuid = { version = "1.23.2", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jiff = { version = "0.2.28", features = ["serde"] }
interp = { path = "../interp" }
ratatui = "0.30.1"
textwrap = "0.16"
unicode-width = "0.2"
tempfile = "3"
ureq = { version = "3.3", features = ["json"] }
# PKCE needs SHA-256 and nothing else here does. A hash is not a
# secret-dependent operation so a hand-rolled one would be safe, but
# "we wrote our own hash for the auth code" is not a sentence worth
# defending when the standard crate is this small.
sha2 = "0.10"
wait-timeout = "0.2"
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"

[dev-dependencies]
